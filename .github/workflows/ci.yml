name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  swift-package:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  project-validation:
    runs-on: macos-latest
    needs: swift-package
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: |
          brew untap aws/tap azure/bicep || true
          brew install xcodegen

      - name: Verify generated macOS project is up to date
        run: ./scripts/generate_macos_xcodeproj.sh --check

      - name: Verify generated iOS project
        run: bash ./scripts/generate_ios_xcodeproj.sh

  macos-release-validation:
    runs-on: macos-latest
    needs: project-validation
    env:
      SPARKLE_FEED_URL: https://example.com/appcast.xml
      SPARKLE_PUBLIC_ED_KEY: test-public-ed-key
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install release tooling
        run: |
          brew untap aws/tap azure/bicep || true
          brew install xcodegen

      - name: Build Whisper runtime
        run: ENABLE_XCFRAMEWORK_BUILD=OFF ./scripts/build_whisper_xcframework.sh

      - name: Download smoke-test model
        run: ./scripts/download_models.sh

      - name: Run release preflight
        run: ./scripts/preflight_macos_release.sh

      - name: Run macOS smoke test
        run: ./scripts/smoke_test_macos_app.sh --skip-launch
