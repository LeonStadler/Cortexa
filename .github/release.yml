changelog:
  exclude:
    labels:
      - skip-release-notes
    authors:
      - dependabot[bot]
  categories:
    - title: "⚠️ Breaking changes"
      labels:
        - breaking-change
    - title: "✨ Features and improvements"
      labels:
        - enhancement
    - title: "🐛 Bug fixes"
      labels:
        - bug
    - title: "📚 Documentation"
      labels:
        - documentation
    - title: "🧰 Maintenance"
      labels:
        - maintenance
    - title: "Other changes"
      labels:
        - "*"
